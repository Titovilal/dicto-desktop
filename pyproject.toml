[project]
name = "dicto"
version = "3.0.0"
description = "Minimalist desktop app for voice-to-text transcription with global hotkey (Windows)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Titovilal", email = "terturionsland@gmail.com" }]
keywords = ["voice", "transcription", "clipboard", "whisper", "hotkey"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "PySide6>=6.5.0",
    "pynput>=1.7.6",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.0",
    "soundcard>=0.4.6",
    "pywin32>=306",
    "httpx>=0.24.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "webrtcvad>=2.0.10",
]

[project.urls]
Homepage = "https://github.com/Titovilal/dicto-desktop"
Repository = "https://github.com/Titovilal/dicto-desktop"
Issues = "https://github.com/Titovilal/dicto-desktop/issues"

[project.scripts]
dicto = "dicto.app:main"

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0",
    "pytest-qt>=4.3",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dicto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "api: tests that hit the real Dicto API (deselect with -m 'not api')",
]
qt_api = "pyside6"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[dependency-groups]
dev = [
    "pyinstaller>=6.18.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.4.2",
    "pytest-qt>=4.5.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
]
