name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create release from pyproject.toml version'
        type: boolean
        default: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      should_release: ${{ steps.check_release.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(grep -Po '(?<=^version = ")[^"]*' pyproject.toml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if should release
        id: check_release
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists"
            echo "should_release=false" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.create_release }}" == "true" ]]; then
            echo "Manual release requested"
            echo "should_release=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "Tag push detected"
            echo "should_release=true" >> $GITHUB_OUTPUT
          else
            echo "No release needed"
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi

  test:
    runs-on: ubuntu-22.04
    # Hard stop: a hung test is immune to a failing exit code -- nothing fails,
    # the run just never returns and holds a runner for the full 6h default.
    # The suite is green and fast today (233 passed in ~33s locally), so this
    # cap should never be reached; it exists so that a future deadlock costs
    # 15 minutes instead of 6 hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          # Qt needs a virtual X server and the xcb platform libs for the
          # pytest-qt (tests/ui) suite; portaudio for the recorder tests.
          sudo apt-get install -y \
            portaudio19-dev libasound2-dev \
            xvfb libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb1 libegl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # This step is REQUIRED: `test` is in `release.needs`, so a red suite
      # blocks the release instead of just annotating it. The suite was red
      # (9 failures) around v2.8.4 and carried a `continue-on-error` for that
      # reason; those are fixed and the run is green, so the flag is gone.
      # Do not reintroduce it to paper over a regression -- fix the test.
      #
      # Note: a benign `_pythonToCppCopy: Cannot copy-convert ... (MagicMock)`
      # line appears on stderr from the Qt binding when a mock is handed to the
      # C++ layer. It does not fail or hang the run; don't chase it as an error.
      - name: Run tests
        run: xvfb-run -a pytest -m "not api" -v --tb=short
        env:
          QT_QPA_PLATFORM: xcb

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build with PyInstaller (onedir)
        # Use the committed spec so the output layout (dist/Dicto/Dicto.exe)
        # matches what installer.iss expects.
        run: pyinstaller --noconfirm dicto.spec

      - name: Build installer with Inno Setup
        run: |
          # Same script `make installer` runs, so a local build and a CI build
          # can no longer disagree about the version (installer.iss used to be
          # patched only here, and drifted to 2.5.1 in the working tree).
          python scripts/sync-installer-version.py
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: dicto-windows-installer
          path: dist/Dicto-*-setup.exe

  build-linux:
    # Pinned, NOT ubuntu-latest. PyInstaller links against the build machine's
    # glibc and glibc is only backward compatible, so the runner's version is
    # the hard floor for users. `ubuntu-latest` silently became 24.04
    # (glibc 2.39), which locks out Ubuntu 22.04 (glibc 2.35) with a segfault
    # rather than a clean apt error. Building on 22.04 costs nothing (we ship
    # no 2.36+ symbols) and keeps both releases working. Bump this only when
    # 22.04 is genuinely dropped -- and never back to a floating label.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev libasound2-dev fakeroot
          # Smoke-test-only: a dummy PulseAudio daemon so PortAudio can
          # actually expose its Pulse host API, plus a virtual X server and the
          # xcb libs Qt needs to open a window headlessly. Not runtime deps of
          # the .deb -- those are declared in scripts/build-deb.sh.
          sudo apt-get install -y \
            pulseaudio pulseaudio-utils \
            xvfb libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb1 libegl1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build with PyInstaller (onedir)
        run: |
          # Use the committed spec: it also drops the bundled PortAudio/ALSA so
          # the app links against the system ones (see .ctx/docs/release.md).
          DICTO_BUNDLE_NAME=dicto pyinstaller --noconfirm dicto-linux.spec
          tar -czf dist/dicto-linux-amd64.tar.gz -C dist dicto

      # ── Smoke tests: catch the v2.8.2 "mic is dead in the .deb" regression ──
      # These run on the built bundle and BEFORE packaging, so a broken bundle
      # never reaches a .deb. See .ctx/docs/release.md.

      - name: Smoke test — no audio libs bundled
        run: |
          # The regression: PyInstaller pulled sounddevice's PortAudio (built
          # without a PulseAudio backend) and a libasound.so.2 without its
          # alsa-lib modules into the bundle, killing the `pulse`/`pipewire`/
          # `default` PCMs. dicto-linux.spec strips them so the app links
          # against the system libs the .deb requires in Depends.
          #
          # This assert is the deterministic half of the check: it needs no
          # audio server, so it can never flake on a headless runner, and it
          # tests exactly the thing that broke.
          found=$(find dist/dicto \
            \( -name 'libportaudio*' -o -name 'libasound*' -o -name 'libjack*' \) \
            -print)
          if [ -n "$found" ]; then
            echo "::error::Audio libs were bundled; the spec's exclusion broke."
            echo "$found"
            exit 1
          fi
          echo "OK: no libportaudio/libasound/libjack inside dist/dicto"

      - name: Smoke test — the bundle does not shadow system libraries
        run: |
          # The v2.8.5 regression, which the startup smoke test below could NOT
          # catch. Excluding libportaudio/libasound/libjack means the app loads
          # the SYSTEM PortAudio, which pulls in the SYSTEM libjack. On a modern
          # distro that libjack needs GLIBCXX_3.4.32, but the bundle's own
          # libstdc++.so.6 (copied from this 22.04 runner, capped at 3.4.30)
          # came first on the linker's search path and won:
          #
          #   OSError: cannot load library 'libportaudio.so.2': .../_internal/
          #   libstdc++.so.6: version `GLIBCXX_3.4.32' not found
          #   (required by /usr/lib/x86_64-linux-gnu/libjack.so.0)
          #
          # Why the startup test missed it: it runs on the SAME 22.04 runner we
          # build on, where the system libjack is just as old as the bundled
          # libstdc++, so they match and the app starts. The failure only shows
          # up on distros NEWER than the build box -- i.e. on users' machines.
          # A smoke test confined to the build distro cannot, by construction,
          # see this class of bug.
          #
          # This check is static (objdump only): no audio server, no display,
          # no container, and it asserts the bundle carries no C++/GCC runtime
          # at all, so it fails on a 22.04 runner too -- where the bug itself
          # does not reproduce.
          sudo apt-get install -y -qq binutils
          python3 scripts/check-bundle-abi.py dist/dicto

      - name: Smoke test — PulseAudio host API is reachable
        run: |
          # The positive half: with the bundle's lib dir on the search path,
          # PortAudio must still expose a PulseAudio host API and see the
          # `pulse` PCM. Pa_Initialize() ABORTS with PaErrorCode -9999 when no
          # server is listening, so a bare runner would fail this for the wrong
          # reason -- hence the dummy daemon below (null sink/source, no
          # hardware required).
          #
          # NOTE: treat this as defence in depth, not as the primary guard.
          # If the bundle re-acquires a libportaudio copied from a build host
          # whose own PortAudio *does* have Pulse support, this still passes
          # while the shipped .deb breaks on user machines. The preceding
          # "no audio libs bundled" step is the assertion that actually pins
          # the regression; this one catches a PortAudio built without the
          # Pulse backend, which is what bit us on the runner.
          #
          # Because it needs a live daemon, it can fail for reasons that have
          # nothing to do with the bundle -- on a GitHub runner `pulseaudio
          # --start` may refuse to come up at all (no session bus, no
          # /run/user/$UID). That environment failure must not block a release
          # when the deterministic check above already passed, so a daemon that
          # will not start downgrades to a warning. A daemon that IS running and
          # still shows no Pulse host API is a real finding and fails the job.
          set -x
          pulseaudio --start --exit-idle-time=-1 --disallow-exit -n \
            --load="module-null-sink sink_name=dummy" \
            --load="module-null-source source_name=dummymic" || true

          if ! pactl info; then
            echo "::warning::No PulseAudio daemon on the runner; skipping the" \
                 "host-API check. The 'no audio libs bundled' assert above is" \
                 "the one that pins the regression and it passed."
            exit 0
          fi

          python - <<'PY'
          import sounddevice as sd
          apis = [h["name"] for h in sd.query_hostapis()]
          print("host APIs:", apis)
          assert "PulseAudio" in apis, f"PulseAudio backend missing: {apis}"
          print("OK: PulseAudio host API present")
          PY
        env:
          # Put the bundle's lib dir first: if a PortAudio/ALSA ever sneaks
          # back in, this is the copy that gets loaded, so the check exercises
          # what the .deb would actually ship rather than the system libs.
          LD_LIBRARY_PATH: dist/dicto/_internal

      - name: Smoke test — the built binary starts
        run: |
          # The binary opens a GUI and never exits on its own, so we run it
          # under a virtual X server, give it a fixed budget and then kill it.
          # Success is the "Dicto started!" banner, which main.py logs only
          # after settings, controller, tray, overlay and hotkeys are all wired
          # up -- i.e. a real startup, not just "the ELF was executable".
          # SIGTERM at 60s (main.py handles it and shuts down cleanly),
          # SIGKILL 15s later so a wedged Qt loop can never park the job.
          # 60s is only the ceiling: the app is killed as soon as the banner
          # shows up, so a healthy run takes a few seconds.
          # Run from a scratch dir purely for hygiene: the run leaves $PWD
          # untouched. (It does NOT write config.yaml into $PWD -- a frozen
          # build resolves the config to ~/.config/dicto/config.yaml, see
          # get_config_dir() in src/config/settings.py.)
          # HOME desechable, no sólo $PWD: el arranque escribe su config en
          # ~/.config/dicto/config.yaml. Lanzar el bundle con el HOME real
          # machaca la config del usuario -- incluida su API key, sin backup.
          # Da igual en un runner efímero, pero este bloque se copia y se pega
          # para reproducir en local, y allí sí duele. Ya pasó.
          bundle="$PWD/dist/dicto/dicto"
          run_dir="$(mktemp -d)"
          ( cd "$run_dir" && \
            timeout --signal=TERM --kill-after=15s 60s \
              env "HOME=$run_dir" "XDG_CONFIG_HOME=$run_dir/.config" \
                xvfb-run -a "$bundle" ) >/tmp/dicto-smoke.log 2>&1 &
          app_pid=$!

          for _ in $(seq 60); do
            grep -q "Dicto started!" /tmp/dicto-smoke.log && break
            kill -0 "$app_pid" 2>/dev/null || break   # died early
            sleep 1
          done
          kill "$app_pid" 2>/dev/null || true
          wait "$app_pid" 2>/dev/null || true

          echo "----- startup log -----"
          cat /tmp/dicto-smoke.log
          echo "-----------------------"

          if ! grep -q "Dicto started!" /tmp/dicto-smoke.log; then
            echo "::error::Binary did not reach a working startup."
            exit 1
          fi
          # "Failed to initialize components" (main.py) and NOT "Failed to
          # start application": the latter is logged by an `except Exception`
          # in main(), but the init failure path calls sys.exit(1), which
          # raises SystemExit -- not a subclass of Exception -- so that handler
          # never runs and the string can never appear. This check grepped for
          # a line the app cannot emit, i.e. it could never fire.
          if grep -qi "Failed to initialize components" /tmp/dicto-smoke.log; then
            echo "::error::Startup reported a fatal error."
            exit 1
          fi
          echo "OK: binary started cleanly"
        env:
          # No API key on the runner; the app must still boot without one.
          DICTO_API_KEY: ci-smoke-test
          QT_QPA_PLATFORM: xcb

      - name: Smoke test — the binary starts on a NEWER distro
        run: |
          # The other half of the v2.8.5 gap. The step above proves the binary
          # starts on the distro we BUILD on; this one proves it starts on a
          # distro newer than that, which is where v2.8.5 died and where most
          # users actually are. Ubuntu 24.04 ships the glibc/libstdc++/libjack
          # generation that exposed the bug (its libjack needs GLIBCXX_3.4.32).
          #
          # Docker is preinstalled on GitHub runners. Only the .deb's declared
          # Depends are installed inside -- nothing from this runner leaks in --
          # so this doubles as a check that the Depends list is complete.
          #
          # Not flaky by design: no audio server and no network beyond apt; the
          # app is killed the moment the banner appears. A pull/apt failure is
          # an infrastructure problem, not a bundle problem, so it downgrades to
          # a warning -- the static check above is the deterministic guard.
          if ! docker pull -q ubuntu:24.04; then
            echo "::warning::Could not pull ubuntu:24.04; skipping the" \
                 "newer-distro run. The static shadowing check still ran."
            exit 0
          fi

          docker run --rm -v "$PWD/dist/dicto:/bundle:ro" ubuntu:24.04 bash -c '
            set -e
            apt-get update -qq >/dev/null 2>&1
            # libasound2 was renamed libasound2t64 in 24.04 (the 64-bit time_t
            # transition), and plain `libasound2` has no install candidate
            # there. Asking for the wrong one aborts the whole apt call, which
            # made this step fail with a bogus "xvfb: No such file" instead of
            # a real result. Pick whichever the release actually provides.
            asound=libasound2
            apt-cache policy libasound2 | grep -q "Candidate: (none)" \
              && asound=libasound2t64
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
              libportaudio2 "$asound" libpulse0 libxcb-cursor0 libxcb-icccm4 \
              libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
              libxcb-shape0 libxcb-util1 libxcb-xkb1 libdbus-1-3 xvfb \
              >/dev/null 2>&1
            echo "container glibc: $(ldd --version | head -1)"

            export DICTO_API_KEY=ci-smoke-test QT_QPA_PLATFORM=xcb HOME=/root
            timeout --signal=TERM --kill-after=15s 90s \
              xvfb-run -a /bundle/dicto >/tmp/log 2>&1 &
            pid=$!
            for _ in $(seq 80); do
              grep -q "Dicto started!" /tmp/log && break
              kill -0 $pid 2>/dev/null || break
              sleep 1
            done
            kill $pid 2>/dev/null || true; wait $pid 2>/dev/null || true

            echo "----- startup log (ubuntu 24.04) -----"; cat /tmp/log
            echo "--------------------------------------"
            grep -q "Dicto started!" /tmp/log || {
              echo "::error::Binary does not start on Ubuntu 24.04."
              echo "This is the v2.8.5 failure mode: a library in the bundle is"
              echo "shadowing a newer system library. See .ctx/docs/release.md."
              exit 1
            }
            echo "OK: binary starts on Ubuntu 24.04"
          '

      - name: Package .deb
        run: |
          # Reuse the onedir bundle just built (PyInstaller is invoked via uv in
          # the script, which CI doesn't use, so skip that step).
          SKIP_PYINSTALLER=1 bash scripts/build-deb.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dicto-linux-amd64
          path: |
            dist/dicto-linux-amd64.tar.gz
            dist/dicto_*.deb

  release:
    # `test` is here on purpose: a red suite must block the release, not just
    # annotate it. Removing it silently makes the test job decorative.
    needs: [version, test, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: needs.version.outputs.should_release == 'true' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: dicto-windows-installer
          path: dist/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: dicto-linux-amd64
          path: dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          files: |
            dist/Dicto-*-setup.exe
            dist/dicto-linux-amd64.tar.gz
            dist/dicto_*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
